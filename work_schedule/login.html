<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login Portal</title>
    <link rel="stylesheet" href="static/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-container">
      <div class="card login-card">
        <!-- 🌻 Wrap the first word or add an emoji inside <span> to catch our custom gold theme color -->
        <h2><span>🌻</span> Student Login Portal</h2>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username-input" placeholder="Enter username" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="password-input"
            placeholder="Enter password"
          />
        </div>

        <p id="login-error" class="error-text hidden">
          Invalid credentials. Try again.
        </p>
        <button
          onclick="submitLogin()"
          style="width: 100%; padding: 12px; margin-top: 10px"
        >
          Sign In
        </button>
      </div>
    </div>

    <script>
      const API_URL = "https://onrender.com"; // NO slash at the end!

      // If user is already logged in, skip this page entirely
      if (localStorage.getItem("authToken")) {
        window.location.href = "index.html";
      }

      async function submitLogin() {
        const username = document.getElementById("username-input").value;
        const password = document.getElementById("password-input").value;
        const errorText = document.getElementById("login-error");

        try {
          const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          if (!response.ok) throw new Error();

          const result = await response.json();
          // Store session pass key securely in the browser
          localStorage.setItem("authToken", result.token);

          // Redirect user to the dashboard page!
          window.location.href = "index.html";
        } catch (err) {
          errorText.classList.remove("hidden");
        }
      }
    </script>
  </body>
</html>
